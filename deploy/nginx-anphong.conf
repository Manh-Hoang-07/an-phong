# Cấu hình Nginx cho Ẩn Phong.
# Chép vào /etc/nginx/sites-available/anphong, sửa server_name, rồi:
#   sudo ln -s /etc/nginx/sites-available/anphong /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d game.ten-mien-cua-ban.vn     (bật HTTPS miễn phí)
server {
    listen 80;
    server_name game.ten-mien-cua-ban.vn;   # hoặc địa chỉ IP của server

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
