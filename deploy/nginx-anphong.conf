# Cấu hình Nginx cho Ẩn Phong.
# Chép vào /etc/nginx/sites-available/anphong, sửa server_name, rồi:
#   sudo ln -s /etc/nginx/sites-available/anphong /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d game.ten-mien-cua-ban.vn     (bật HTTPS miễn phí)
#
# Sau khi certbot thêm khối HTTPS (listen 443 ssl), sửa dòng đó thành:
#     listen 443 ssl;
#     http2 on;                 # Nginx 1.25+  (bản cũ hơn: listen 443 ssl http2;)
# HTTP/2 cho phép tải nhiều file cùng lúc trên một kết nối → mở game nhanh hơn rõ rệt trên 4G.
#
# Nén: server Node đã tự nén (brotli/gzip) và gắn mã phiên bản cho file, Nginx chỉ cần chuyển tiếp nguyên vẹn.
server {
    listen 80;
    server_name game.ten-mien-cua-ban.vn;   # hoặc địa chỉ IP của server

    client_max_body_size 64k;

    # WebSocket (người chơi thấy nhau + chat): giữ kết nối mở, ping 25 giây một lần nên 120 giây là đủ
    location /ws {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # giữ kết nối tới Node để dùng lại (đỡ mở kết nối mới mỗi lượt)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        gzip off;                                # Node đã nén rồi, không nén lần nữa
    }
}
