# Cấu hình Nginx cho Ẩn Phong.
# Chép vào /etc/nginx/sites-available/anphong, sửa server_name, rồi:
#   sudo ln -s /etc/nginx/sites-available/anphong /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d game.ten-mien-cua-ban.vn     (bật HTTPS miễn phí)
#
# HTTP/2: bật trong block HTTPS bên dưới (http2 on; cho Nginx 1.25+, bản cũ dùng
#   "listen 443 ssl http2;"). HTTP/2 chỉ chạy trên HTTPS — block :80 giữ nguyên để
#   site vẫn lên trước khi có cert; sau khi certbot xong nên chuyển :80 thành redirect.
#
# Nén: server Node đã tự nén brotli/gzip và gắn mã phiên bản cho file. Nginx phải giữ
#   gzip off / brotli off — bật nén ở đây chỉ làm nén TRÙNG, tốn CPU mà không nhỏ hơn.
#   Điểm cần bật ở Nginx là HTTP/2 (nhiều file ảnh tải song song trên 1 kết nối) và
#   keepalive tới upstream (đỡ mở lại kết nối tới Node mỗi request).

upstream anphong_node {
    server 127.0.0.1:3100;
    keepalive 16;          # giữ sẵn 16 kết nối tới Node, dùng lại cho request sau
}

server {
    listen 80;
    server_name game.ten-mien-cua-ban.vn;   # hoặc địa chỉ IP của server

    client_max_body_size 64k;

    # WebSocket (người chơi thấy nhau + chat): giữ kết nối mở, ping 25 giây một lần nên 120 giây là đủ
    location /ws {
        proxy_pass http://anphong_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://anphong_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # bật keepalive tới upstream (không gửi Connection: close)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        gzip off;                                # Node đã nén rồi, không nén lần nữa
    }
}

