<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#060a18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Thức Tỉnh</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Màn hình đăng nhập -->
  <div id="login" class="screen hidden">
    <div class="login-box">
      <div class="sys-tag">◆ HỆ THỐNG</div>
      <h1>THỨC TỈNH</h1>
      <p class="sub">Cổng dịch chuyển đã mở. Bạn đã được chọn.</p>
      <form id="login-form" autocomplete="on">
        <input id="lf-user" name="username" placeholder="Tên đăng nhập" autocomplete="username" required>
        <input id="lf-pass" name="password" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
        <input id="lf-char" name="charName" placeholder="Tên nhân vật" maxlength="16" class="hidden">
        <button type="submit" id="lf-submit" class="btn primary big">Vào game</button>
        <p id="lf-error" class="error"></p>
        <p id="lf-note" class="note"></p>
      </form>
    </div>
  </div>

  <div id="loading" class="screen"><div class="spinner"></div><p>Đang tải...</p></div>

  <!-- Game -->
  <div id="game-wrap" class="hidden">
    <div id="game"></div>

    <div id="hud" class="hidden">
      <div id="hud-char">
        <div class="hud-top">
          <div class="hud-ava"><span id="h-ava">👤</span><b id="h-rank" class="rank">E</b></div>
          <div class="hud-id">
            <div class="hud-name"><span id="h-name"></span> <span id="h-level" class="lv"></span></div>
            <div class="hud-school" id="h-school"></div>
          </div>
        </div>
        <div class="bar hp"><div id="h-hp"></div><span id="h-hp-t"></span></div>
        <div class="bar mp"><div id="h-mp"></div><span id="h-mp-t"></span></div>
        <div class="bar exp"><div id="h-exp"></div><span id="h-exp-t"></span></div>
        <div class="hud-gold">🪙 <span id="h-gold"></span></div>
      </div>
      <div id="hud-right">
        <div id="h-map"></div>
        <div class="menu">
          <button id="btn-menu" title="Menu (I / C / K / L)">☰<b id="h-points" class="badge hidden"></b></button>
        </div>
        <div id="quest-track"></div>
      </div>
      <div id="log"></div>
      <div id="skillbar">
        <div class="sk" data-k="atk"><span class="key">J</span><span class="ico" id="sk-atk-ico">⚔</span><div class="cd"></div></div>
        <div class="sk" data-k="0"><span class="key">1</span><span class="ico"></span><div class="cd"></div></div>
        <div class="sk" data-k="1"><span class="key">2</span><span class="ico"></span><div class="cd"></div></div>
        <div class="sk" data-k="2"><span class="key">3</span><span class="ico"></span><div class="cd"></div></div>
        <div class="sk" data-k="3"><span class="key">4</span><span class="ico"></span><div class="cd"></div></div>
        <div class="sk sk-extra hidden" data-k="4"><span class="key">5</span><span class="ico"></span><div class="cd"></div></div>
        <div class="sk sk-ult" data-k="5"><span class="key">R</span><span class="ico"></span><div class="cd"></div></div>
        <div class="sk pot" data-k="hp"><span class="key">Q</span><span class="ico">❤</span><span class="cnt" id="pot-hp"></span></div>
        <div class="sk pot" data-k="mp"><span class="key">E</span><span class="ico">💧</span><span class="cnt" id="pot-mp"></span></div>
      </div>
      <div id="hint"></div>
    </div>

    <!-- Điều khiển cảm ứng cho điện thoại -->
    <div id="touch" class="hidden">
      <!-- Cần điều khiển: chạm vào bất kỳ đâu ở nửa trái màn hình rồi kéo -->
      <div id="joy-zone">
        <div id="joy-base"><div id="joy-knob"></div></div>
        <div id="joy-tip">Chạm và kéo để di chuyển<br>Kéo lên để nhảy</div>
      </div>
      <div id="tbtns">
        <button data-t="attack" class="tb tb-attack"><span class="ico" id="tb-atk-ico">⚔</span><div class="cd"></div></button>
        <button data-t="jump" class="tb tb-jump">⤒</button>
        <button data-t="s0" class="tb tb-skill tb-s0"><span class="ico"></span><div class="cd"></div></button>
        <button data-t="s1" class="tb tb-skill tb-s1"><span class="ico"></span><div class="cd"></div></button>
        <button data-t="s2" class="tb tb-skill tb-s2"><span class="ico"></span><div class="cd"></div></button>
        <button data-t="s3" class="tb tb-skill tb-s3"><span class="ico"></span><div class="cd"></div></button>
        <button data-t="s4" class="tb tb-skill tb-s4 hidden"><span class="ico"></span><div class="cd"></div></button>
        <button data-t="ult" class="tb tb-skill tb-ult"><span class="ico"></span><div class="cd"></div></button>
        <button data-t="hp" class="tb tb-pot tb-hp">🧪<b id="tpot-hp"></b></button>
        <button data-t="mp" class="tb tb-pot tb-mp">💧<b id="tpot-mp"></b></button>
      </div>
      <button id="tb-talk" data-t="interact" class="tb tb-talk hidden">💬 <span></span></button>
    </div>
    <div id="rotate"><div>📱 ↻</div><p>Xoay ngang điện thoại để chơi</p></div>

    <div id="panel" class="hidden">
      <div class="panel-box">
        <div class="panel-head"><h2 id="panel-title"></h2><button id="panel-close" title="Đóng (Esc)">✕</button></div>
        <div id="panel-body"></div>
      </div>
    </div>
    <div id="tooltip" class="hidden"></div>
    <div id="banner" class="hidden"></div>
  </div>

  <script src="/lib/phaser.min.js"></script>
  <script src="/shared/data.js"></script>
  <script src="/js/sound.js"></script>
  <script src="/js/net.js"></script>
  <script src="/js/art.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/sprites.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/world.js"></script>
  <script src="/js/juice.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
